<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>English Mix Reader</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.wrap{max-width:900px;margin:auto;padding:18px 14px 40px}
h1{font-size:23px;margin:0 0 4px}.lead{margin:0 0 16px;color:#666;font-size:13px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 6px #0001}
textarea{display:block;width:100%;min-height:190px;padding:12px;border:1px solid #d6d9de;border-radius:10px;font:16px/1.7 inherit;resize:vertical}
.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.slider{display:flex;align-items:center;gap:9px;flex:1;min-width:270px}
.slider input{width:170px;accent-color:#222}.pct{font-weight:700;min-width:45px}
button{border:1px solid #cdd1d7;background:#fff;border-radius:9px;padding:10px 14px;font-size:15px;cursor:pointer}
button.primary{background:#222;color:#fff;border-color:#222}
button:disabled{opacity:.45;cursor:not-allowed}
.section-title{font-weight:700;margin-bottom:9px}
#result{font-size:20px;line-height:2.15;white-space:pre-wrap;overflow-wrap:anywhere}
.word{border-radius:4px;padding:1px 2px;cursor:pointer}.word.jp{background:#eef3ff}
.speech{border-top:1px solid #eee;margin-top:16px;padding-top:14px}
.speechrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.state,.note{font-size:12px;color:#666;line-height:1.6}
.score{font-size:24px;font-weight:800;margin-top:10px}
.transcript{font-size:14px;line-height:1.6;color:#444;margin-top:6px;white-space:pre-wrap}
.good{color:#176b2c}.warn{color:#8a5200}
@media(max-width:600px){.wrap{padding:13px 10px 28px}h1{font-size:21px}#result{font-size:18px;line-height:2.05}.slider{min-width:100%}.slider input{flex:1}}
</style>
</head>
<body>
<main class="wrap">
<h1>English Mix Reader</h1>
<p class="lead">英文の語順を保ったまま、日本語を足場として読む練習</p>

<section class="card">
<textarea id="src" placeholder="教科書本文をここに貼り付けてください。"></textarea>
<div class="controls">
  <div class="slider">
    <span>日本語の量</span>
    <input id="level" type="range" min="0" max="100" value="50" step="5" aria-label="日本語の量">
    <span id="pct" class="pct">50%</span>
  </div>
  <button class="primary" id="mix">日本語を混ぜる</button>
  <button id="clear">クリア</button>
</div>
<p class="note">スライダーを動かすと表示がリアルタイムで変わります。日本語になった語をタップすると英語に戻せます。</p>
</section>

<section class="card">
<div class="section-title">読む練習</div>
<div id="status" class="state">本文を入力して「日本語を混ぜる」を押してください。</div>
<div id="result"></div>

<div class="speech">
<div class="speechrow">
<button id="mic">🎙 音読チェックを開始</button>
<button id="stop" disabled>停止</button>
<span id="speechState" class="state">マイクはまだ起動していません。</span>
</div>
<div id="score"></div>
<div id="transcript" class="transcript"></div>
<p class="note">音声認識は対応ブラウザで動作します。初回はマイク許可が必要です。スコアは認識された英単語と本文の一致度による簡易評価で、発音そのものの精密評価ではありません。</p>
</div>
</section>
</main>

<script>
const STOP=new Set(`a an the this that these those my your his her its our their some any each every all both either neither i you he she it we they me him her us them who whom which what where when why how am is are was were be been being do does did have has had can could may might must shall should will would and but or nor so yet for in on at by from to of with about into over under after before during through between among against as than then if because while although though unless until since whether not no very more most much many few little own same other another also just only even still already again too here there up down out off away back`.trim().split(/\\s+/));
const DICT={
children:"子どもたち",people:"人々",person:"人",women:"女性たち",woman:"女性",men:"男性たち",man:"男性",
students:"生徒たち",student:"生徒",teachers:"教師たち",teacher:"教師",schools:"学校",school:"学校",
animals:"動物たち",animal:"動物",world:"世界",life:"生活",lives:"生活",place:"場所",places:"場所",
problem:"問題",problems:"問題",important:"重要な",different:"異なる",possible:"可能な",safe:"安全な",
dangerous:"危険な",useful:"役立つ",excellent:"優れた",build:"建てる",builds:"建てる",built:"建てた",
create:"作る",creates:"作る",created:"作った",protect:"守る",protects:"守る",learn:"学ぶ",learns:"学ぶ",
learned:"学んだ",learning:"学ぶこと",understand:"理解する",understands:"理解する",understood:"理解した",
use:"使う",uses:"使う",used:"使われる",live:"暮らす",lives:"暮らす",lived:"暮らした",make:"作る",
makes:"作る",made:"作った",find:"見つける",found:"見つけた",help:"助ける",helped:"助けた",
need:"必要とする",needs:"必要とする",wanted:"望んだ",want:"望む",become:"～になる",became:"～になった",
know:"知っている",knew:"知っていた",think:"考える",thought:"考えた",believe:"信じる",believed:"信じた",
give:"与える",gave:"与えた",take:"取る",took:"取った",get:"得る",got:"得た",keep:"保つ",kept:"保った",
provide:"提供する",provided:"提供した",include:"含む",included:"含まれた",cause:"引き起こす",caused:"引き起こした",
however:"しかし",therefore:"したがって",especially:"特に",usually:"通常",often:"しばしば",sometimes:"ときどき",
environment:"環境",environmental:"環境の",technology:"技術",nature:"自然",energy:"エネルギー",future:"未来",
history:"歴史",society:"社会",research:"研究",information:"情報",experience:"経験",reason:"理由",example:"例",
country:"国",countries:"国々",city:"都市",cities:"都市",water:"水",food:"食べ物",air:"空気"
};
const cache=new Map();let expected=[];let recognition=null,recognizing=false,finalText="";

function tokens(s){return s.match(/\\s+|[A-Za-z]+(?:['’-][A-Za-z]+)*|[^A-Za-z\\s]/g)||[]}
function isWord(t){return /^[A-Za-z]+(?:['’-][A-Za-z]+)*$/.test(t)}
function normWord(t){return t.toLowerCase().replace(/[’']/g,"'")}
function content(t){return isWord(t)&&!STOP.has(normWord(t))&&normWord(t).length>1}
function scoreSeed(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h%100}
async function translateWord(w){
 const k=normWord(w);if(DICT[k])return DICT[k];if(cache.has(k))return cache.get(k);
 const u="https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ja&dt=t&q="+encodeURIComponent(w);
 const r=await fetch(u);if(!r.ok)throw Error("translation");
 const d=await r.json(),jp=(d?.[0]||[]).map(x=>x?.[0]||"").join("")||w;cache.set(k,jp);return jp;
}
function render(level){
 const result=document.getElementById("result"),src=document.getElementById("src").value.trim();if(!src)return;
 result.innerHTML="";
 for(const t of tokens(src)){
  if(!isWord(t)){result.appendChild(document.createTextNode(t));continue}
  const s=document.createElement("span");s.className="word";s.dataset.en=t;s.textContent=t;
  const jp=cache.get(normWord(t));
  if(content(t)&&scoreSeed(normWord(t))<level&&jp){s.classList.add("jp");s.dataset.jp=jp;s.textContent=jp;s.title=`${t} ⇄ ${jp}`}
  s.onclick=()=>{if(!s.dataset.jp)return;const on=s.classList.toggle("jp");s.textContent=on?s.dataset.jp:s.dataset.en};
  result.appendChild(s);
 }
}
async function mix(){
 stopSpeech();const src=document.getElementById("src").value.trim(),status=document.getElementById("status");
 if(!src){status.textContent="本文を入力してください。";return}
 const ts=tokens(src),words=ts.filter(isWord);expected=words.map(normWord);
 const targets=ts.filter(content);status.textContent=`${targets.length}語を準備しています…`;
 for(const t of targets){if(!cache.has(normWord(t))){try{await translateWord(t)}catch(e){}}}
 render(+document.getElementById("level").value);
 status.textContent="完成。スライダーで日本語の量を調整できます。";
 document.getElementById("score").innerHTML="";document.getElementById("transcript").textContent="";
}
function normalize(s){return s.toLowerCase().replace(/[^a-z'\\s-]/g," ").replace(/\\s+/g," ").trim().split(" ").filter(Boolean)}
function editDistance(a,b){
 const d=Array.from({length:a.length+1},(_,i)=>[i]);for(let j=1;j<=b.length;j++)d[0][j]=j;
 for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
 return d[a.length][b.length];
}
function showScore(){
 const heard=normalize(finalText),n=Math.max(expected.length,heard.length,1);
 const score=Math.max(0,Math.round(100*(1-editDistance(expected,heard)/n)));
 document.getElementById("score").innerHTML=`<div class="score">音読スコア：${score} / 100</div>`;
 document.getElementById("transcript").textContent=`認識結果：${finalText.trim()||"（認識できませんでした）"}`;
}
function makeRecognition(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){document.getElementById("speechState").textContent="このブラウザは音声認識に対応していません。Chrome / Edge をお試しください。";return null}
 const r=new SR();r.lang="en-US";r.continuous=true;r.interimResults=true;
 r.onstart=()=>{recognizing=true;document.getElementById("speechState").textContent="音読を認識中…";document.getElementById("mic").disabled=true;document.getElementById("stop").disabled=false};
 r.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){let t=e.results[i][0].transcript;if(e.results[i].isFinal)finalText+=" "+t;else interim+=" "+t}document.getElementById("transcript").textContent=`認識中：${(finalText+" "+interim).trim()}`};
 r.onerror=e=>{document.getElementById("speechState").textContent=`音声認識エラー：${e.error}`;stopSpeech()};
 r.onend=()=>{if(recognizing){try{r.start()}catch(e){}}else{document.getElementById("speechState").textContent="音読チェック終了";showScore()}};
 return r;
}
function startSpeech(){
 if(!expected.length){alert("先に「日本語を混ぜる」を実行してください。");return}
 finalText="";document.getElementById("score").innerHTML="";document.getElementById("transcript").textContent="";
 recognition=recognition||makeRecognition();if(!recognition)return;try{recognition.start()}catch(e){}
}
function stopSpeech(){if(!recognition)return;recognizing=false;try{recognition.stop()}catch(e){}document.getElementById("mic").disabled=false;document.getElementById("stop").disabled=true}
document.getElementById("level").oninput=e=>{document.getElementById("pct").textContent=e.target.value+"%";render(+e.target.value)}
document.getElementById("mix").onclick=mix;
document.getElementById("mic").onclick=startSpeech;
document.getElementById("stop").onclick=stopSpeech;
document.getElementById("clear").onclick=()=>{stopSpeech();document.getElementById("src").value="";document.getElementById("result").innerHTML="";document.getElementById("score").innerHTML="";document.getElementById("transcript").textContent="";document.getElementById("status").textContent="本文を入力して「日本語を混ぜる」を押してください。";expected=[]};
</script>
</body>
</html>
